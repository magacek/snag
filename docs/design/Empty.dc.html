<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; }
    a { color: #7c85e8; } a:hover { color: #99a1f0; }
  </style>
</helmet>

<div style="position: relative; width: 760px; height: 560px; overflow: hidden; background: #0a0a0c;">
  <div style="position: absolute; inset: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 9px; opacity: 0.5;">
    <div style="width: 62%; height: 8px; border-radius: 3px; background: #17171b;"></div>
    <div style="width: 84%; height: 8px; border-radius: 3px; background: #17171b;"></div>
    <div style="width: 41%; height: 8px; border-radius: 3px; background: #17171b;"></div>
  </div>

  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 400px; background: rgba(17, 17, 20, 0.95); border: 0.5px solid rgba(255, 255, 255, 0.09); border-radius: 10px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.60), 0 2px 6px rgba(0, 0, 0, 0.4), inset 0 0.5px 0 rgba(255, 255, 255, 0.06); padding: 5px;">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 9px 8px 9px;">
      <span style="font-size: 11px; font-weight: 510; letter-spacing: 0.01em; color: #9a9aa6;">Clipboard</span>
      <span style="font-size: 10px; color: #4a4a53;">release to dismiss</span>
    </div>
    <div style="display: flex; align-items: center; gap: 9px; height: 52px; padding: 0 9px;">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#3d3d45" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.25" y="2.25" width="9.5" height="11.5" rx="1.75"></rect>
        <path d="M6 1.25h4v2H6z"></path>
      </svg>
      <span style="font-size: 12px; color: #5a5a64;">Nothing copied yet</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
